<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP CELEBRATIONS Admin</title>
<style>body{font-family:system-ui;background:#0b0d12;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:25px}h1{color:#f6c453}.box{background:#141720;border:1px solid #292e3b;border-radius:16px;padding:18px;margin:16px 0}input,textarea,select,button{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #343948;background:#0e1118;color:#fff}button{background:#f6c453;color:#17120a;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}.msg{color:#8ff0a4;white-space:pre-wrap}</style></head><body><div class="wrap">
<h1>VIP CELEBRATIONS — Admin</h1><p>Simple content manager. Your admin key is kept in Cloudflare as a secret; never publish it in the website.</p>
<div class="box"><h2>Admin Key</h2><input id="key" type="password" placeholder="Enter ADMIN_KEY"><button onclick="saveKey()">Save Key</button><div id="msg" class="msg"></div></div>
<div class="box"><h2>Create Decoration Album</h2><div class="row"><input id="title" placeholder="Album title"><input id="price" type="number" min="1000" value="1000" placeholder="Price"></div><textarea id="desc" placeholder="Description"></textarea><div class="row"><select id="program"><option value="">Program</option></select><select id="budget"><option value="">Budget</option></select></div><input id="keywords" placeholder="SEO keywords, comma separated"><input id="yt" placeholder="YouTube URL for this decoration"><button onclick="createAlbum()">Create Album</button><div id="albumOut"></div></div>
<div class="box"><h2>Add YouTube Video</h2><input id="vurl" placeholder="YouTube video URL"><input id="vtitle" placeholder="Video title"><textarea id="vdesc" placeholder="Description"></textarea><button onclick="addVideo()">Add / Update Video</button></div>
<div class="box"><h2>Upload Photo to Album</h2><input id="aid" type="number" placeholder="Album ID"><input id="file" type="file" accept="image/*"><input id="alt" placeholder="Image alt text"><button onclick="uploadPhoto()">Upload Photo</button></div>
<div class="box"><h2>Website Setting</h2><div class="row"><input id="sk" placeholder="Setting key e.g. logo_url"><input id="sv" placeholder="Value"></div><button onclick="saveSetting()">Save Setting</button></div>
</div>
<script>
const key=()=>localStorage.vipAdminKey||'';function saveKey(){localStorage.vipAdminKey=document.querySelector('#key').value;document.querySelector('#msg').textContent='Key saved in this browser.'}
async function call(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key()};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){const [p,b]=await Promise.all([fetch('/api/programs').then(r=>r.json()),fetch('/api/budgets').then(r=>r.json())]);p.forEach(x=>document.querySelector('#program').insertAdjacentHTML('beforeend',`<option value="${x.id}">${x.name}</option>`));b.forEach(x=>document.querySelector('#budget').insertAdjacentHTML('beforeend',`<option value="${x.id}">${x.name}</option>`))}
async function createAlbum(){try{const d=await call('/api/admin/album',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:title.value,price:price.value,description:desc.value,program_id:program.value,budget_id:budget.value,keywords:keywords.value,youtube_url:yt.value})});albumOut.textContent='Album created. ID: '+d.id}catch(e){albumOut.textContent=e.message}}
async function addVideo(){try{await call('/api/admin/video',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:vurl.value,title:vtitle.value,description:vdesc.value})});alert('Video saved')}catch(e){alert(e.message)}}
async function uploadPhoto(){try{const f=file.files[0],fd=new FormData();fd.append('album_id',aid.value);fd.append('file',f);fd.append('alt_text',alt.value);const d=await call('/api/admin/photo-upload',{method:'POST',body:fd});alert('Uploaded: '+d.key)}catch(e){alert(e.message)}}
async function saveSetting(){try{await call('/api/admin/setting',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:sk.value,value:sv.value})});alert('Saved')}catch(e){alert(e.message)}}
init()
</script></body></html>
